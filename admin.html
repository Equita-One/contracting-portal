<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equita Contracting — Admin Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--line:#2d333b;--txt:#e6edf3;--dim:#8b949e;--acc:#2f81f7;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--gold:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top .logo{font-weight:800;letter-spacing:.4px}.top .logo span{color:var(--gold)}
.top .who{margin-left:auto;color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
nav a{padding:9px 14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--txt);border-color:var(--gold)}
main{padding:16px 18px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--acc)}
button{background:var(--acc);border:0;color:#fff;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
button.ok{background:var(--ok)}button.warn{background:var(--warn);color:#111}button.bad{background:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid #21262d;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#1a2029}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.c-ok{background:#12351c;color:#4ade80}.c-warn{background:#3b2f10;color:#fbbf24}.c-bad{background:#3d1418;color:#f87171}
.c-dim{background:#21262d;color:var(--dim)}.c-acc{background:#122a4d;color:#7ab7ff}.c-gold{background:#332a10;color:var(--gold)}
h2{font-size:17px;margin-bottom:10px}h3{font-size:14px;margin:12px 0 6px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv{font-size:13px}.kv b{color:var(--dim);font-weight:600;display:inline-block;min-width:130px}
.gate{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.gate .dot{width:10px;height:10px;border-radius:50%}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--warn)}
.drawer{position:fixed;top:0;right:-100vw;width:100vw;max-width:100vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:100;transition:right .22s;overflow-y:auto;padding:18px}
.drawer.open{right:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}.overlay.on{display:block}
.login{max-width:400px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}
.login input{width:100%;margin-bottom:10px}
.muted{color:var(--dim);font-size:12px}
.note{background:#1b2430;border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:12.5px;color:#d8c07a;margin:8px 0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243044;border:1px solid var(--acc);padding:10px 18px;border-radius:8px;z-index:200;display:none}
details.sec{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel2)}
details.sec summary{padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
details.sec .inner{padding:4px 12px 10px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.drawer{width:100vw}}
/* producer notes (stacks above the producer drawer) */
.nmodal{position:fixed;top:0;right:-560px;width:540px;max-width:96vw;height:100vh;background:var(--panel2);border-left:1px solid var(--line);z-index:130;transition:right .2s;overflow-y:auto;padding:18px}
.nmodal.open{right:0}
.novl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:none}.novl.on{display:block}
.noteline{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel)}
.noteline .meta{font-size:11.5px;color:var(--dim);margin-bottom:4px}
@media(max-width:900px){.nmodal{width:100vw}}
.doccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.doccard{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;transition:background .15s,border-color .15s}
.doccard:hover{background:#1f6feb1a;border-color:var(--acc)}
.doccard .dc-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.doccard .dc-name{font-weight:600;font-size:13px;color:var(--txt);word-break:break-word;line-height:1.3}
.doccard .dc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--dim)}
.doccard .dc-open{margin-top:9px;font-size:12px;color:var(--acc);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="ovl" onclick="UI.closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="novl" id="nm_ovl" onclick="closeNotes()"></div>
<div class="nmodal" id="nm"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   Equita Contracting Admin Console — Phase 3 (SureLC BGA replacement)
   Architecture: hash-routed views + RPC data layer (adm_* SECURITY DEFINER,
   row-level scoped by admin_accounts). Static-file deploy, AMS-style JS inside.
   v2: full producer profile, agency settings, alerts, completed-by, bulk reassign, CSV exports.
   ============================================================ */
const SB_URL='https://tcivqllwxodihiphhknp.supabase.co';
const SB_KEY='sb_publishable_dwkJS210Aqbe77Wlq6wmvQ_kTjIqBt2';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

/* ---------------- Data layer ---------------- */
const API={
  secret:sessionStorage.getItem('adm_secret')||null,
  me:null,
  async rpc(fn,args={}){
    if(this.secret) args.p_secret=this.secret;
    const {data,error}=await sb.rpc(fn,args);
    if(error) throw new Error(error.message);
    return data;
  },
  async login(email,pw){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; },
  async whoami(){ this.me=await this.rpc('adm_me'); return this.me; },
  canWrite(){ return this.me && ['full_admin','agency_worker','affiliate_processor'].includes(this.me.role); },
  canSubmit(){ return this.canWrite() && this.me.can_submit; },
  isFull(){ return this.me && this.me.role==='full_admin'; }
};

/* ---------------- UI helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>s?new Date(s).toLocaleDateString():'—';
const UI={
  toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);},
  openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('open');$('#ovl').classList.add('on');},
  closeDrawer(){$('#drawer').classList.remove('open');$('#ovl').classList.remove('on');},
  chipStage(s){const m={draft:'c-dim',ready:'c-acc',submitted:'c-gold',completed:'c-ok',approved:'c-ok',declined:'c-bad'};return `<span class="chip ${m[s]||'c-dim'}">${esc(s||'—')}</span>`;},
  chipDba(t){ if(!t) return '<span class="chip c-bad">not defined</span>';
    const m={business:'c-acc',individual:'c-ok',loa:'c-warn'};return `<span class="chip ${m[(t||'').toLowerCase()]||'c-dim'}">${esc(t)}</span>`;},
  csv(rows,name){ if(!rows||!rows.length){UI.toast('Nothing to export');return;}
    const cols=Object.keys(rows[0]);
    const body=rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([cols.join(',')+'\n'+body],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
};

/* ---------------- Router ---------------- */
const VIEWS={producers:Producers,requests:Requests,affiliations:Affiliations,firms:Firms,carriers:Carriers,reports:Reports,prefills:Prefills,alerts:Alerts,agency:Agency,admins:Admins};
async function route(){
  const v=(location.hash||'#producers').slice(1).split('/')[0];
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const fn=VIEWS[v]||Producers;
  $('#view').innerHTML='<div class="card muted">Loading…</div>';
  try{ await fn(); }catch(e){ $('#view').innerHTML=`<div class="card"><span class="chip c-bad">error</span> ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange',route);

/* ---------------- Shell ---------------- */
function shell(){
  const m=API.me;
  const tabs=[['producers','Producers'],['requests','Requests'],['affiliations','Affiliations'],['firms','Firms'],['carriers','Carriers'],['reports','Reports'],['prefills','Pre-fills'],['alerts','Alerts'],['agency','Agency']];
  if(API.isFull()) tabs.push(['admins','Admins']);
  $('#app').innerHTML=`
  <div class="top"><div class="logo">EQUITA <span>CONTRACTING</span> · Admin</div>
    <div class="who">${esc(m.email)} · <span class="chip c-gold">${esc(m.role)}</span>${m.can_submit?'':' · <span class="chip c-warn">complete-only</span>'}
    &nbsp;<a href="#" onclick="logout();return false">sign out</a></div></div>
  <nav>${tabs.map(([v,l])=>`<a href="#${v}" data-v="${v}">${l}</a>`).join('')}</nav>
  <main id="view"></main>`;
  route();
}
async function logout(){ await sb.auth.signOut(); sessionStorage.removeItem('adm_secret'); location.reload(); }

/* ---------------- Login ---------------- */
function loginView(msg){
  $('#app').innerHTML=`
  <div class="login"><div class="logo" style="font-weight:800;font-size:18px;margin-bottom:14px">EQUITA <span style="color:var(--gold)">CONTRACTING</span> · Admin</div>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <input id="li_e" type="email" placeholder="Admin email">
  <input id="li_p" type="password" placeholder="Password">
  <button style="width:100%" onclick="doLogin()">Sign in</button>
  <div class="muted" style="margin:12px 0 6px">— or —</div>
  <input id="li_k" type="password" placeholder="Access key">
  <button class="sec" style="width:100%" onclick="doKey()">Enter with access key</button>
  <div class="muted" style="margin-top:10px">Access is scoped: partners see only their own agents.</div></div>`;
}
async function doLogin(){
  try{ await API.login($('#li_e').value.trim(),$('#li_p').value);
    const me=await API.whoami();
    if(!me.ok) return loginView('Signed in, but this email is not an active admin account.');
    shell();
  }catch(e){ loginView(e.message); }
}
async function doKey(){
  API.secret=$('#li_k').value.trim(); sessionStorage.setItem('adm_secret',API.secret);
  try{ const me=await API.whoami(); if(!me.ok) throw new Error('bad key'); shell(); }
  catch(e){ sessionStorage.removeItem('adm_secret'); API.secret=null; loginView('Invalid access key.'); }
}

/* ================= PRODUCERS ================= */
let AFF_CACHE=null;
async function affOptions(sel){
  if(!AFF_CACHE){ const r=await API.rpc('adm_affiliations'); AFF_CACHE=r.rows||[]; }
  return `<option value="">All affiliations</option>`+AFF_CACHE.map(a=>`<option value="${a.id}" ${String(sel)===String(a.id)?'selected':''}>${esc(a.name)} (${a.agent_count})</option>`).join('');
}
async function Producers(){
  const opts=await affOptions();
  $('#view').innerHTML=`
  <div class="card"><h2>Producer directory</h2>
    <div class="row"><input id="p_q" placeholder="Search name, email, NPN…" style="min-width:260px" onkeydown="if(event.key==='Enter')loadProducers()">
    <select id="p_aff" onchange="loadProducers()">${opts}</select>
    <button onclick="loadProducers()">Search</button>
    <button class="sec" onclick="UI.csv(window._prod,'producers.csv')">Export CSV</button>
    <span class="muted" id="p_total"></span></div>
    ${API.canWrite()?`<div class="row" id="p_bulk" style="display:none;margin-top:8px">
      <span class="muted"><b id="p_selcount">0</b> selected</span>
      <select id="p_reaff">${opts.replace('All affiliations','— move to affiliation —')}</select>
      <button class="warn" onclick="bulkReassign()">Reassign selected</button></div>`:''}</div>
  <div class="card" id="p_tbl"><div class="muted">Search or pick an affiliation.</div></div>`;
  loadProducers();
}
async function loadProducers(){
  const q=$('#p_q').value.trim(), aff=$('#p_aff').value?Number($('#p_aff').value):null;
  const r=await API.rpc('adm_producers',{p_search:q,p_affiliation_id:aff,p_limit:100,p_offset:0});
  $('#p_total').textContent=`${r.total} producers`;
  const rows=r.rows||[]; window._prod=rows;
  const cw=API.canWrite();
  $('#p_tbl').innerHTML=rows.length?`<table><tr>${cw?'<th></th>':''}<th title="Producer's full name from the contracting/SureLC record. Click a row to open the full profile.">Name</th><th title="Primary email on the producer's contracting profile / portal login.">Email</th><th title="National Producer Number — the producer's NIPR license ID.">NPN</th><th title="Best contact phone number on the producer's profile.">Phone</th><th title="The agency/affiliation this producer is assigned to; drives scoping and the contracting workflow.">Affiliation</th><th title="Business type: LOA, individual, or business entity — determines agent vs agency paperwork.">DBA</th><th title="Current contracting stage for this producer (e.g. in_contracting, submitted, completed).">Status</th></tr>`+
    rows.map(p=>`<tr class="click" onclick="producerDetail('${p.id}')">
      ${cw?`<td onclick="event.stopPropagation()"><input type="checkbox" class="psel" value="${p.id}" onchange="selCount()"></td>`:''}
      <td><b>${esc(p.first_name)} ${esc(p.last_name)}</b></td><td>${esc(p.email)}</td><td>${esc(p.npn||'—')}</td>
      <td>${esc(p.phone||'—')}</td><td>${esc(p.affiliation_name||'—')}</td><td>${UI.chipDba(p.dba_type)}</td>
      <td>${UI.chipStage(p.contract_status||p.stage)}</td></tr>`).join('')+'</table>':'<div class="muted">No matches.</div>';
  selCount();
}
function selCount(){
  const n=document.querySelectorAll('.psel:checked').length;
  const bar=$('#p_bulk'); if(!bar) return;
  bar.style.display=n?'flex':'none';
  const c=$('#p_selcount'); if(c) c.textContent=n;
}
async function bulkReassign(){
  const ids=[...document.querySelectorAll('.psel:checked')].map(c=>c.value);
  const aff=$('#p_reaff').value?Number($('#p_reaff').value):null;
  if(!ids.length) return UI.toast('Nothing selected');
  if(!aff) return UI.toast('Pick a destination affiliation');
  if(!confirm(`Reassign ${ids.length} producer(s) to the selected affiliation?`)) return;
  const r=await API.rpc('adm_reassign_producers',{p_ids:ids,p_affiliation_id:aff});
  UI.toast(r.ok?`Reassigned ${r.reassigned}`:r.error);
  if(r.ok){AFF_CACHE=null;loadProducers();}
}
/* -------- SureLC document cards: roll each file under its matching section, click to open PDF -------- */
function docSection(kind){
  const k=(kind||'').toLowerCase();
  if(k==='check'||k.includes('void')||k.includes('eft')||k.includes('bank')) return 'banking';
  if(k==='eno'||k.includes('e&o')||k.includes('e & o')||k.includes('errors')||k.includes('liability')) return 'eo';
  if(k==='training'||k.includes('aml')||k.includes('ltc')||k.includes('annuity training')) return 'training';
  if(k==='explanation'||k.includes('explan')||k.includes('background')||k.includes('disclosure')) return 'background';
  if(k.includes('signature')) return 'signature';
  if(k==='license'||k.includes('license')||k.includes('nipr')) return 'licenses';
  if(k.includes('finra')||k.includes('u4')||k.includes('u-4')) return 'finra';
  return 'other';
}
function docCard(x){
  return `<div class="doccard" onclick="openDoc('${x.id}',this)" title="Open PDF">
    <div class="dc-row"><span class="dc-name">${esc(x.filename||'Document')}</span><span class="chip c-acc">PDF</span></div>
    <div class="dc-meta"><span>${esc(x.kind||'Document')}</span><span>${fmtD(x.created_at)}</span>${x.is_generated?'<span class="chip c-dim">generated</span>':''}</div>
    <div class="dc-open">Open PDF &#8599;</div></div>`;
}
function docCardsFor(sec){
  const arr=(window._DOCS||[]).filter(x=>docSection(x.kind)===sec);
  return arr.length?`<div class="doccards">${arr.map(docCard).join('')}</div>`:'';
}
function injectDocCards(){
  document.querySelectorAll('#drawer details.sec').forEach(det=>{
    const sum=det.querySelector('summary'); const inner=det.querySelector('.inner'); if(!sum||!inner) return;
    const t=(sum.textContent||'').trim().toLowerCase(); let key=null;
    if(t.startsWith('licenses')) key='licenses';
    else if(t.startsWith('background')) key='background';
    else if(t.startsWith('banking')) key='banking';
    else if(t.startsWith('e&o')||t.startsWith('e & o')) key='eo';
    else if(t.startsWith('training')) key='training';
    else if(t.startsWith('signature')) key='signature';
    else if(t.startsWith('finra')) key='finra';
    else if(t.startsWith('documents')) key='other';
    if(!key) return;
    const html=docCardsFor(key); if(!html) return;
    inner.insertAdjacentHTML('beforeend', html);
    const n=(window._DOCS||[]).filter(x=>docSection(x.kind)===key).length;
    if(n && !sum.querySelector('.docbadge')) sum.insertAdjacentHTML('beforeend', ` <span class="chip docbadge" style="background:#c9a22733;color:#c9a227">&#128206; ${n}</span>`);
  });
}
async function openDoc(id,el){
  try{ if(el){el.style.opacity='.6';el.style.pointerEvents='none';}
    const {data:{session}}=await sb.auth.getSession();
    const tok=session?session.access_token:SB_KEY;
    const res=await fetch(`${SB_URL}/functions/v1/adm-doc-url`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify({docId:id})});
    const j=await res.json();
    if(el){el.style.opacity='';el.style.pointerEvents='';}
    if(j&&j.url) window.open(j.url,'_blank'); else UI.toast('Error: '+((j&&j.error)||res.status));
  }catch(e){ if(el){el.style.opacity='';el.style.pointerEvents='';} UI.toast('Error: '+e.message); }
}
async function producerDetail(id){
  const d=await API.rpc('adm_producer_full',{p_id:id});
  if(!d.ok) return UI.toast(d.error);
  try{ window._DOCS=((await API.rpc('adm_producer_docs',{p_id:id}))||{}).documents||[]; }catch(e){ window._DOCS=[]; }
  const p=d.producer, pr=d.profile||{}, sig=d.signature||{}, eft=d.eft, fin=d.finra;
  window._curP={id:p.id,name:((p.first_name||'')+' '+(p.last_name||'')).trim()};
  const sect=(title,badge,inner)=>`<details class="sec"><summary>${title} ${badge||''}</summary><div class="inner">${inner}</div></details>`;
  const cnt=a=>`<span class="chip ${a&&a.length?'c-acc':'c-dim'}">${a?a.length:0}</span>`;
  UI.openDrawer(`
  <div class="row" style="justify-content:space-between"><h2>${esc(p.first_name)} ${esc(p.last_name)}</h2>
    <div class="row" style="gap:6px">
      <button class="sec" onclick="openNotes()">Notes</button>
      <button class="sec" onclick="UI.closeDrawer()">Close</button></div></div>
  <div class="pill-row">${UI.chipDba(pr.dba_type)} ${UI.chipStage(p.contract_status||p.stage)}
    ${d.affiliation?`<span class="chip c-acc">${esc(d.affiliation.name)}</span>`:''}
    ${p.writing_number?`<span class="chip c-gold">W# ${esc(p.writing_number)}</span>`:''}</div>
  ${!pr.dba_type&&API.canWrite()?`<div class="note">Business type not defined — by convention this usually means LOA.
    <button class="warn" style="margin-left:8px;padding:4px 10px" onclick="setDba('${p.id}','loa')">Set LOA</button>
    <button class="sec" style="padding:4px 10px" onclick="setDba('${p.id}','individual')">Individual</button>
    <button class="sec" style="padding:4px 10px" onclick="setDba('${p.id}','business')">Business entity</button></div>`:''}
  <div class="grid2">
    <div><h3>Contact</h3><div class="kv"><b>Email</b>${esc(p.email)}</div><div class="kv"><b>Phone</b>${esc(p.phone||'—')}</div>
      <div class="kv"><b>NPN</b>${esc(p.npn||'—')}</div><div class="kv"><b>SSN</b>${pr.ssn_last4?'••'+esc(pr.ssn_last4):'—'}</div>
      <div class="kv"><b>DOB</b>${fmtD(pr.dob)}</div>
      <div class="kv"><b>Resident</b>${esc(pr.res_city||'')} ${esc(pr.res_state||'')}</div></div>
    <div><h3>Business / DBA</h3><div class="kv"><b>Entity</b>${esc(pr.business_name||'—')}</div><div class="kv"><b>TIN</b>${esc(pr.tin?'••'+String(pr.tin).slice(-4):'—')}</div>
      <div class="kv"><b>Corp NPN</b>${esc(pr.corporate_lic_number||'—')}</div>

      <div class="gate"><span class="dot ${g.documents>0?'g':'y'}"></span>Supporting documents: <b>${g.documents||0}</b></div>
      ${!agentReady?'<div class="note">Agent-owned sections incomplete — submission is gated. Send back to the agent.</div>':''}
    </div>

      <div class="kv" style="margin-top:6px"><b>Comp level</b><input id="rq_level" value="${esc(r.comp_level||'')}" style="width:90px">
        <input id="rq_tier" placeholder="tier e.g. E140" style="width:110px">
        <button class="sec" onclick="gridLookup('${esc(r.carrier_key)}')">Grid lookup</button>
        <span class="muted">${cfg.level_boxes>1?cfg.level_boxes+' level boxes on form':''}</span></div>
      <div class="kv" style="margin-top:6px"><b>Advance</b>${cfg.advance_months||9}-month${cfg.advance_amount?' / $'+cfg.advance_amount:''}</div>
      <h3>Carrier questions</h3>
      <div id="rq_qa">${Object.keys(qd).length?Object.entries(qd).map(([k,v])=>`
        <div class="kv" style="margin-bottom:4px"><b>${esc(k)}</b><input data-qk="${esc(k)}" value="${esc(v??'')}" style="width:200px"></div>`).join(''):'<div class="muted">None configured.</div>'}

async function gridLookup(ck){
  const t=$('#rq_tier').value.trim(); if(!t) return UI.toast('Enter a tier code (e.g. E140)');

async function saveRequest(id){
  const cby=($('#rq_cby')?$('#rq_cby').value:'').trim();
  if(!cby){UI.toast('Completed by is required — enter your name to continue');$('#rq_cby').focus();return;}
  const prods=[...document.querySelectorAll('[data-line]')].filter(c=>c.checked).map(c=>c.dataset.line);
  const qa={};document.querySelectorAll('[data-qk]').forEach(i=>{qa[i.dataset.qk]=i.value;});
  const r=await API.rpc('adm_request_complete',{p_id:id,p_products:JSON.stringify(prods)===JSON.stringify([])?null:prods,
    p_upline:$('#rq_upline').value.trim()||null,p_comp_level:$('#rq_level').value.trim()||null,p_carrier_answers:qa,p_completed_by:cby});
  UI.toast(r.ok?'Saved':r.error);
}
async function genPacket(id,fn){
  UI.toast('Generating packet…');
  try{
    const {data:{session}}=await sb.auth.getSession();
    const tok=session?session.access_token:SB_KEY;
    const res=await fetch(`${SB_URL}/functions/v1/${fn}`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},
      body:JSON.stringify({request_id:id})});
    const j=await res.json();
    if(res.status===409) return UI.toast('Blocked: disclosures incomplete ('+(j.unanswered||[]).join(', ')+')');
    if(!res.ok||j.error) return UI.toast('Error: '+(j.error||res.status));
    UI.toast(`Packet generated (${j.pages} pages) — emailed for review`);
  }catch(e){ UI.toast('Error: '+e.message); }
}

    <div class="kv"><b>Upline depth</b><select id="cc_ud"><option ${c.upline_depth==='immediate'?'selected':''}>immediate</option><option ${c.upline_depth==='full_chain'?'selected':''}>full_chain</option></select></div>

async function carrierSave(key){
  try{
    const r=await API.rpc('adm_carrier_config_save',{p:{carrier_key:key,
      display_name:document.querySelector('.drawer h2').textContent,
      status:$('#cc_status').value,upline_depth:$('#cc_ud').value,level_boxes:Number($('#cc_lb').value)||1,
      advance_months:Number($('#cc_am').value)||9,advance_amount:$('#cc_aa').value||null,

/* ================= REPORTS ================= */
async function Reports(){
  const today=new Date().toISOString().slice(0,10);
  const wk=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  $('#view').innerHTML=`
  <div class="card"><h2>Appointments by Producer with Details</h2>
    <div class="row"><input type="date" id="rp_from" value="${wk}"><input type="date" id="rp_to" value="${today}">
    <button onclick="runAppt()">Run</button><button class="sec" onclick="UI.csv(window._appt,'appointments_by_producer.csv')">Download CSV</button></div>
  <div id="rp_tbl" style="margin-top:10px"><div class="muted">Every producer who completed a contract in range, with affiliation and carriers.</div></div></div>
  <div class="card"><h2>Self-Removed Producers</h2>
    <div class="row"><button class="sec" onclick="runRemoved()">Run</button></div><div id="rp2_tbl" style="margin-top:10px"></div></div>`;
}
async function runAppt(){
  const r=await API.rpc('adm_report_appointments',{p_from:$('#rp_from').value,p_to:$('#rp_to').value});
  const rows=r.rows||[]; window._appt=rows;
  $('#rp_tbl').innerHTML=rows.length?`<table><tr><th>Producer</th><th>Affiliation</th><th>Carrier</th><th>Stage</th><th>Level</th><th>Submitted</th></tr>`+
    rows.map(x=>`<tr><td><b>${esc(x.producer_name)}</b><div class="muted">${esc(x.email)}</div></td><td>${esc(x.affiliation_name||'—')}</td>
    <td>${esc(x.carrier_name)}</td><td>${UI.chipStage(x.stage)}</td><td>${esc(x.comp_level||'—')}</td><td>${fmtD(x.submitted_at)}</td></tr>`).join('')+'</table>'
    :'<div class="muted">No appointments in range.</div>';
}
async function runRemoved(){
  const r=await API.rpc('adm_report_self_removed');
  const rows=r.rows||[];
  $('#rp2_tbl').innerHTML=rows.length?`<table><tr><th>Producer</th><th>Email</th><th>Affiliation</th><th>Kind</th><th>Removed</th></tr>`+
    rows.map(x=>`<tr><td>${esc(x.producer_name||'—')}</td><td>${esc(x.producer_email||'—')}</td><td>${esc(x.affiliation_name||'—')}</td>

/* ================= PRE-FILLS ================= */

    <div class="muted">Saved defaults (upline, our details, standard values) the wizard applies automatically.</div></div>
  <div class="card">${rows.length?`<table><tr><th>Carrier</th><th>Label</th><th>Scope</th><th>Fields</th><th></th></tr>`+
    rows.map(x=>`<tr><td><b>${esc(x.carrier_key)}</b></td><td>${esc(x.label)}</td><td>${esc(x.affiliation_name||'all')}</td>

function pfEdit(x){
  x=x||{fields:{upline:'Senior Advisor Services'}};

  <div class="kv" style="margin:8px 0"><b>Carrier</b><select id="pf_c">${(window._cc||[]).map(k=>`<option ${x.carrier_key===k?'selected':''}>${k}</option>`).join('')}</select></div>

async function pfSave(id){
  try{
    const r=await API.rpc('adm_prefill_save',{p_id:id,p_carrier:$('#pf_c').value,p_affiliation_id:null,p_label:$('#pf_l').value.trim(),p_fields:JSON.parse($('#pf_f').value)});

/* ================= AGENCY (settings + principals + agency E&O) ================= */

  const r=await API.rpc('adm_agency_settings');
  if(!r.ok){$('#view').innerHTML=`<div class="card">${esc(r.error)}</div>`;return;}
  const s=r.settings||{}; const ro=API.isFull()?'':'readonly disabled';
  const F=(id,lbl,val,w)=>`<div class="kv" style="margin:6px 0"><b>${lbl}</b><input id="ag_${id}" value="${esc(val||'')}" style="width:${w||220}px" ${ro}></div>`;
  $('#view').innerHTML=`
  <div class="card"><h2>Agency settings</h2>
    <div class="muted">The agency's own identity, principals and E&amp;O — used by packet generators and reports. ${API.isFull()?'':'Read-only for your role.'}</div>
    <div class="grid2" style="margin-top:8px">
      <div><h3>General info</h3>
        ${F('legal','Legal name',s.legal_name)}${F('dba','DBA name',s.dba_name)}
        ${F('ein','EIN',s.ein,140)}${F('npn','Corporate NPN',s.corporate_npn,140)}
        ${F('phone','Phone',s.phone,160)}${F('email','Email',s.email)}
        ${F('web','Website',s.website)}
        ${F('a1','Address 1',s.addr1)}${F('a2','Address 2',s.addr2)}
        ${F('city','City',s.city,160)}${F('state','State',s.state,70)}${F('zip','Zip',s.zip,100)}</div>
      <div><h3>Agency E&amp;O</h3>
        ${F('eop','Provider',s.eo_provider)}${F('eon','Policy #',s.eo_policy_number)}
        ${F('eoe','Coverage each',s.eo_coverage_each,140)}${F('eoa','Coverage aggregate',s.eo_coverage_aggregate,140)}
        <div class="kv" style="margin:6px 0"><b>Effective</b><input id="ag_eff" type="date" value="${esc(s.eo_effective||'')}" ${ro}></div>
        <div class="kv" style="margin:6px 0"><b>Expiration</b><input id="ag_exp" type="date" value="${esc(s.eo_expiration||'')}" ${ro}></div>
        <h3>DBA template</h3>
        <textarea id="ag_dbat" style="width:100%" rows="3" ${ro}>${esc(s.dba_template||'')}</textarea></div>
    </div>
    <h3>Principals (JSON: [{"name","title","npn","signature_role"}])</h3>
    <textarea id="ag_prin" style="width:100%" rows="4" ${ro}>${esc(JSON.stringify(s.principals||[],null,1))}</textarea>
    ${API.isFull()?`<div class="row" style="margin-top:10px"><button onclick="agencySave()">Save</button>
      <span class="muted">Last updated ${fmtD(s.updated_at)}${s.updated_by?' by '+esc(s.updated_by):''}</span></div>`:''}</div>`;
}
async function agencySave(){
  let prin;
  try{ prin=JSON.parse($('#ag_prin').value||'[]'); }catch(e){ return UI.toast('Principals JSON invalid: '+e.message); }
  const p={legal_name:$('#ag_legal').value.trim(),dba_name:$('#ag_dba').value.trim()||null,ein:$('#ag_ein').value.trim()||null,
    corporate_npn:$('#ag_npn').value.trim()||null,phone:$('#ag_phone').value.trim()||null,email:$('#ag_email').value.trim()||null,
    website:$('#ag_web').value.trim()||null,addr1:$('#ag_a1').value.trim()||null,addr2:$('#ag_a2').value.trim()||null,
    city:$('#ag_city').value.trim()||null,state:$('#ag_state').value.trim()||null,zip:$('#ag_zip').value.trim()||null,
    principals:prin,eo_provider:$('#ag_eop').value.trim()||null,eo_policy_number:$('#ag_eon').value.trim()||null,
    eo_coverage_each:$('#ag_eoe').value.trim()||null,eo_coverage_aggregate:$('#ag_eoa').value.trim()||null,
    eo_effective:$('#ag_eff').value||null,eo_expiration:$('#ag_exp').value||null,dba_template:$('#ag_dbat').value.trim()||null};

/* ================= ADMINS ================= */
async function Admins(){
  const r=await API.rpc('adm_admins');
  if(!r.ok){$('#view').innerHTML=`<div class="card">${esc(r.error)}</div>`;return;}
  const rows=r.rows||[];
  $('#view').innerHTML=`
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Admins & roles</h2>
    <button onclick="admEdit(null)">+ Add admin</button></div>
    <div class="muted">Affiliate roles are scoped to one affiliation. “Complete without submit” = processes everything, a submitter double-checks. Completions are stamped with the rep's name (required).</div></div>
  <div class="card"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Scope</th><th>Submit</th><th>Active</th><th></th></tr>
  ${rows.map(a=>`<tr><td><b>${esc(a.full_name||'—')}</b></td><td>${esc(a.email)}</td>
    <td><span class="chip c-gold">${esc(a.role)}</span></td><td>${esc(a.affiliation_name||'org-wide')}</td>
    <td>${a.can_submit?'<span class="chip c-ok">yes</span>':'<span class="chip c-warn">complete-only</span>'}</td>
    <td>${a.active?'<span class="chip c-ok">active</span>':'<span class="chip c-dim">off</span>'}</td>
    <td><button class="sec" style="padding:4px 10px" onclick='admEdit(${JSON.stringify(a).replace(/'/g,"&#39;")})'>Edit</button></td></tr>`).join('')}</table></div>`;
}
async function admEdit(a){
  a=a||{role:'agency_worker',can_submit:true,active:true};
  const opts=await affOptions(a.affiliation_id);
  UI.openDrawer(`<h2>${a.id?'Edit':'New'} admin</h2>
  <div class="kv" style="margin:8px 0"><b>Email</b><input id="ad_e" value="${esc(a.email||'')}" ${a.id?'readonly':''}></div>
  <div class="kv" style="margin:8px 0"><b>Name</b><input id="ad_n" value="${esc(a.full_name||'')}"></div>
  <div class="kv" style="margin:8px 0"><b>Role</b><select id="ad_r">${['full_admin','agency_manager','agency_worker','affiliate_processor','affiliate_worker'].map(x=>`<option ${a.role===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="kv" style="margin:8px 0"><b>Affiliation scope</b><select id="ad_a">${opts}</select></div>
  <div class="kv" style="margin:8px 0"><b>Can submit</b><select id="ad_s"><option value="true" ${a.can_submit?'selected':''}>yes</option><option value="false" ${!a.can_submit?'selected':''}>complete without submit</option></select></div>
  <div class="kv" style="margin:8px 0"><b>Active</b><select id="ad_x"><option value="true" ${a.active?'selected':''}>active</option><option value="false" ${!a.active?'selected':''}>disabled</option></select></div>
  <div class="kv" style="margin:8px 0"><b>${a.id?'Reset password':'Password'}</b><input id="ad_pw" type="password" autocomplete="new-password" placeholder="${a.id?'leave blank to keep current':'min 8 characters'}"></div>
  <div class="row" style="margin-top:8px"><button onclick="admSave()">Save</button><button class="sec" onclick="UI.closeDrawer()">Cancel</button></div>`);
}
async function admSave(){
  const email=$('#ad_e').value.trim(), full_name=$('#ad_n').value.trim();
  const role=$('#ad_r').value, affiliation_id=$('#ad_a').value||null;
  const can_submit=$('#ad_s').value==='true', active=$('#ad_x').value==='true';
  const isNew=!$('#ad_e').readOnly;
  const pw=($('#ad_pw')?$('#ad_pw').value:'')||'';
  if(isNew && pw.length<8){ UI.toast('Set a password (min 8 characters) for the new user.'); return; }
  if(pw && pw.length<8){ UI.toast('Password must be at least 8 characters.'); return; }
  if(isNew || pw){
    try{
      const headers=API.secret?{'x-sweep-secret':API.secret}:{};
      const {data,error}=await sb.functions.invoke('admin-create-user',{body:{email,password:pw,full_name,role,affiliation_id,can_submit,active},headers});
      if(error) throw new Error((data&&data.error)||error.message);
      if(data&&data.error) throw new Error(data.error);
      UI.toast('Saved'); UI.closeDrawer(); Admins();
    }catch(e){ UI.toast(e.message||String(e)); }
    return;
  }
  const r=await API.rpc('adm_admin_save',{p:{email,full_name,role,affiliation_id,can_submit,active}});
  UI.toast(r.ok?'Saved':r.error); if(r.ok){UI.closeDrawer();Admins();}
}

/* ---------------- boot ---------------- */
(async function(){
  try{
    if(API.secret){ const me=await API.whoami(); if(me.ok) return shell(); }
    const {data:{session}}=await sb.auth.getSession();
    if(session){ const me=await API.whoami(); if(me.ok) return shell(); }
  }catch(_){}
  loginView();
})();
</script>
